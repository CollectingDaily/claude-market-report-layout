<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">One report, two editions: the Collecting Daily wording is yours</tspan></text><rect x="40" y="70" width="380" height="190" rx="12" fill="#ffffff" stroke="#d7d2bb"/><path d="M40,82 a12,12 0 0 1 12,-12 h356 a12,12 0 0 1 12,12 v34 h-380 Z" fill="#323748"/><text x="60" y="99" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="60" dy="0.0">Paul Fraser Collectibles edition</tspan></text><text x="60" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60" dy="0.0">Our stock includes signed letters,</tspan><tspan x="60" dy="23.0">photographs and documents.</tspan></text><rect x="560" y="70" width="380" height="190" rx="12" fill="#ffffff" stroke="#d7d2bb"/><path d="M560,82 a12,12 0 0 1 12,-12 h356 a12,12 0 0 1 12,12 v34 h-380 Z" fill="#414042"/><text x="580" y="99" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="580" dy="0.0">Collecting Daily edition</tspan></text><text x="580" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="580" dy="0.0">Paul Fraser Collectibles, our sister</tspan><tspan x="580" dy="23.0">company, has signed letters,</tspan><tspan x="580" dy="23.0">photographs and documents.</tspan></text><line x1="440" y1="165" x2="536" y2="165" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M533,157 L545,165 L533,173 Z" fill="#8fd1d5"/><text x="492" y="145" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6f7280" text-anchor="middle"><tspan x="492" dy="0.0">you write</tspan></text><text x="492" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6f7280" text-anchor="middle"><tspan x="492" dy="0.0">the new words</tspan></text><text x="490.0" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6f7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Claude finds every sentence that speaks as Paul Fraser Collectibles and asks you how it should read for Collecting Daily.</tspan></text></svg>